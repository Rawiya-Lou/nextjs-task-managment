name: Next.js CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Client Generation
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Next.js Linter
        run: npm run lint

      - name: Next.js Build Target Test
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run Unit Tests
        run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
    
