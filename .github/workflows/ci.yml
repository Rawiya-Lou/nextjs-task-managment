name: Next.js CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os}}-nextjs-${{ hashFiles('**/package-lock.json')}}-${{ hashFiles('**.[jt]s?(x)')}}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json')}}-

      - name: Install dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high  

      - name: Run Prisma Client Generation
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      - name: TypeScript Compiler Check
        run: npx tsc --noEmit    

      - name: Next.js Linter
        run: npm run lint
      - name: Run Unit Tests with Coverage Check
        run: npm run test:coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Create Temporary Test Environment File
        run: |
          echo "DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}" > .env.test
    

      - name: Run Full-Stack Integration Tests
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - name: Next.js Production Compilation Target
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
